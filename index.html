<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Driver Payroll Dashboard</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',sans-serif;
    background:#f3f6f9;
    padding:20px;
}

.container{
    max-width:1400px;
    margin:auto;
}

.header{
    background:#0b7a3e;
    color:white;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
    margin-bottom:20px;
}

.summary{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
}

.box{
    background:#0b7a3e;
    color:white;
    padding:20px;
    border-radius:12px;
    text-align:center;
}

.box h2{
    font-size:32px;
}

input[type=file]{
    padding:10px;
}

button{
    background:#0b7a3e;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#086331;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}

table th{
    background:#0b7a3e;
    color:white;
}

table th,
table td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

.footer{
    text-align:center;
    margin-top:20px;
    color:#777;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🚗 Driver Payroll Dashboard</h1>
        <p>ระบบคำนวณเวลาทำงานจาก GPS Report</p>
    </div>

    <div class="card">
        <h3>อัปโหลดไฟล์ Excel</h3>
        <br>
        <input type="file" id="excelFile" accept=".xlsx,.xls">
    </div>

    <div class="summary">

        <div class="box">
            <h2 id="totalDays">0</h2>
            <p>จำนวนวัน</p>
        </div>

        <div class="box">
            <h2 id="totalHours">0</h2>
            <p>ชั่วโมงรวม</p>
        </div>

        <div class="box">
            <h2 id="avgHours">0</h2>
            <p>เฉลี่ยต่อวัน</p>
        </div>

    </div>

    <div class="card">

        <button onclick="exportExcel()">
            Export Summary
        </button>

        <table id="resultTable">

            <thead>
                <tr>
                    <th>วันที่</th>
                    <th>เริ่มงาน</th>
                    <th>สิ้นสุดงาน</th>
                    <th>ชั่วโมงทำงาน</th>
                </tr>
            </thead>

            <tbody></tbody>

        </table>

    </div>

</div>

<script>

let summaryData = [];

document
.getElementById("excelFile")
.addEventListener("change", handleFile);

function handleFile(event){

    const file = event.target.files[0];

    const reader = new FileReader();

    reader.onload = function(e){

        const data = e.target.result;

        const workbook = XLSX.read(
            data,
            {type:'binary'}
        );

        const sheetName =
        workbook.SheetNames[0];

        const worksheet =
        workbook.Sheets[sheetName];

        const json =
        XLSX.utils.sheet_to_json(
            worksheet,
            {
                header:1,
                raw:true
            }
        );

        processData(json);

    }

    reader.readAsBinaryString(file);

}

function excelDateToJSDate(serial){

    return new Date(
        (serial - 25569) *
        86400 *
        1000
    );

}

function processData(rows){

    let daily = {};

    rows.forEach(row => {

        row.forEach(cell => {

            if(typeof cell === "number"){

                let dt =
                excelDateToJSDate(cell);

                if(!isNaN(dt)){

                    let day =
                    dt.toLocaleDateString(
                        "th-TH"
                    );

                    if(!daily[day]){
                        daily[day] = [];
                    }

                    daily[day].push(dt);

                }

            }

        });

    });

    summaryData = [];

    let totalHours = 0;

    Object.keys(daily).forEach(day=>{

        const times =
        daily[day]
        .sort((a,b)=>a-b);

        const start =
        times[0];

        const end =
        times[times.length-1];

        const hours =
        (
            end - start
        ) / 1000 / 60 / 60;

        totalHours += hours;

        summaryData.push({

            date:day,

            start:start.toLocaleTimeString(
                "th-TH"
            ),

            finish:end.toLocaleTimeString(
                "th-TH"
            ),

            hours:hours.toFixed(2)

        });

    });

    renderTable();

    document
    .getElementById("totalDays")
    .innerText =
    summaryData.length;

    document
    .getElementById("totalHours")
    .innerText =
    totalHours.toFixed(2);

    document
    .getElementById("avgHours")
    .innerText =
    (
        totalHours /
        summaryData.length
    ).toFixed(2);

}

function renderTable(){

    const tbody =
    document.querySelector(
        "#resultTable tbody"
    );

    tbody.innerHTML = "";

    summaryData.forEach(item=>{

        tbody.innerHTML += `
        <tr>
            <td>${item.date}</td>
            <td>${item.start}</td>
            <td>${item.finish}</td>
            <td>${item.hours}</td>
        </tr>
        `;

    });

}

function exportExcel(){

    const ws =
    XLSX.utils.json_to_sheet(
        summaryData
    );

    const wb =
    XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(
        wb,
        ws,
        "Summary"
    );

    XLSX.writeFile(
        wb,
        "Driver_Summary.xlsx"
    );

}

</script>

</body>
</html>
