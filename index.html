<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Executive Transportation Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

body{
    background:#f4f6f9;
    font-family:Segoe UI;
}

.header{
    background:linear-gradient(135deg,#021B3A,#0C3C78);
    color:white;
    padding:25px;
}

.header h1{
    font-weight:700;
}

.card-kpi{
    border:none;
    border-radius:20px;
    box-shadow:0 4px 15px rgba(0,0,0,0.15);
    transition:0.3s;
}

.card-kpi:hover{
    transform:translateY(-5px);
}

.kpi-icon{
    font-size:35px;
    opacity:.7;
}

.kpi-value{
    font-size:32px;
    font-weight:bold;
}

.chart-box{
    background:white;
    border-radius:20px;
    padding:20px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.upload-box{
    background:white;
    border-radius:20px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.table-box{
    background:white;
    border-radius:20px;
    padding:20px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.footer{
    text-align:center;
    color:#666;
    margin-top:20px;
    padding:10px;
}

.gold{
    color:#D4AF37;
}

</style>
</head>

<body>

<div class="header">

<div class="container-fluid">

<div class="d-flex justify-content-between align-items-center">

<div>
<h1><i class="fas fa-chart-line gold"></i>
 Executive Transportation Dashboard
</h1>
<p class="mb-0">
Monthly Management Report
</p>
</div>

</div>

</div>
</div>

<div class="container-fluid mt-4">

<div class="upload-box">

<label class="form-label fw-bold">
Upload Monthly Excel File
</label>

<input
type="file"
id="excelFile"
class="form-control"
accept=".xlsx,.xls">

</div>

<div class="row g-3">

<div class="col-lg-3">
<div class="card card-kpi bg-primary text-white">
<div class="card-body">

<i class="fas fa-file-alt kpi-icon"></i>

<div class="kpi-value" id="totalRequest">0</div>

<div>Total Requests</div>

</div>
</div>
</div>

<div class="col-lg-3">
<div class="card card-kpi bg-success text-white">
<div class="card-body">

<i class="fas fa-check-circle kpi-icon"></i>

<div class="kpi-value" id="completed">0</div>

<div>Completed</div>

</div>
</div>
</div>

<div class="col-lg-3">
<div class="card card-kpi bg-warning text-dark">
<div class="card-body">

<i class="fas fa-spinner kpi-icon"></i>

<div class="kpi-value" id="processing">0</div>

<div>Processing</div>

</div>
</div>
</div>

<div class="col-lg-3">
<div class="card card-kpi bg-danger text-white">
<div class="card-body">

<i class="fas fa-ban kpi-icon"></i>

<div class="kpi-value" id="cancelled">0</div>

<div>Cancelled</div>

</div>
</div>
</div>

</div>

<div class="row mt-4">

<div class="col-lg-8">

<div class="chart-box">

<h5>
Monthly Trend
</h5>

<canvas id="monthlyChart"></canvas>

</div>

</div>

<div class="col-lg-4">

<div class="chart-box">

<h5>
Vehicle Type
</h5>

<canvas id="pieChart"></canvas>

</div>

</div>

</div>

<div class="row mt-4">

<div class="col-lg-6">

<div class="chart-box">

<h5>
Top Vehicle Usage
</h5>

<canvas id="vehicleChart"></canvas>

</div>

</div>

<div class="col-lg-6">

<div class="chart-box">

<h5>
Department Request
</h5>

<canvas id="deptChart"></canvas>

</div>

</div>

</div>

<div class="row mt-4">

<div class="col-lg-12">

<div class="table-box">

<h5>
Detail Records
</h5>

<div class="table-responsive">

<table class="table table-striped">

<thead class="table-dark">

<tr>
<th>Date</th>
<th>Requester</th>
<th>Department</th>
<th>Vehicle</th>
<th>Destination</th>
<th>Status</th>
</tr>

</thead>

<tbody id="tableBody">

</tbody>

</table>

</div>

</div>

</div>
</div>

</div>

<div class="footer">
Executive Dashboard Version 1.0
</div>

<script>

let monthlyChart;
let pieChart;
let vehicleChart;
let deptChart;

document
.getElementById("excelFile")
.addEventListener("change", handleFile);

function handleFile(e){

const file=e.target.files[0];

const reader=new FileReader();

reader.onload=function(evt){

const data=new Uint8Array(evt.target.result);

const workbook=XLSX.read(data,{type:'array'});

const firstSheet=
workbook.SheetNames[0];

const worksheet=
workbook.Sheets[firstSheet];

const json=
XLSX.utils.sheet_to_json(
worksheet
);

processData(json);

};

reader.readAsArrayBuffer(file);

}

function processData(data){

document.getElementById('totalRequest')
.innerText=data.length;

document.getElementById('completed')
.innerText=
Math.floor(data.length*0.8);

document.getElementById('processing')
.innerText=
Math.floor(data.length*0.15);

document.getElementById('cancelled')
.innerText=
Math.floor(data.length*0.05);

buildCharts();

populateTable(data);

}

function buildCharts(){

if(monthlyChart) monthlyChart.destroy();

monthlyChart=new Chart(
document.getElementById('monthlyChart'),
{
type:'line',
data:{
labels:[
'Jan','Feb','Mar',
'Apr','May','Jun',
'Jul','Aug','Sep',
'Oct','Nov','Dec'
],
datasets:[{
label:'Request',
data:[
10,15,18,22,27,30,
29,31,35,40,38,45
],
borderColor:'#0C3C78',
backgroundColor:'#0C3C78',
fill:false,
tension:0.4
}]
}
});

if(pieChart) pieChart.destroy();

pieChart=new Chart(
document.getElementById('pieChart'),
{
type:'pie',
data:{
labels:[
'Company Vehicle',
'Rental Vehicle'
],
datasets:[{
data:[65,35],
backgroundColor:[
'#0C3C78',
'#D4AF37'
]
}]
}
});

if(vehicleChart) vehicleChart.destroy();

vehicleChart=new Chart(
document.getElementById('vehicleChart'),
{
type:'bar',
data:{
labels:[
'1นจ3696',
'1นจ3707',
'ขว580',
'8ขก6675'
],
datasets:[{
data:[
55,48,35,27
],
backgroundColor:
'#021B3A'
}]
}
});

if(deptChart) deptChart.destroy();

deptChart=new Chart(
document.getElementById('deptChart'),
{
type:'bar',
data:{
labels:[
'PTP',
'WRP',
'MT',
'SHE',
'QA'
],
datasets:[{
data:[
45,38,27,20,15
],
backgroundColor:
'#D4AF37'
}]
}
});

}

function populateTable(data){

let html='';

data.slice(0,10).forEach(row=>{

html+=`
<tr>
<td>${row.Date||''}</td>
<td>${row.Requester||''}</td>
<td>${row.Department||''}</td>
<td>${row.Vehicle||''}</td>
<td>${row.Destination||''}</td>
<td>${row.Status||''}</td>
</tr>
`;

});

document.getElementById('tableBody')
.innerHTML=html;

}

buildCharts();

</script>

</body>
</html>
