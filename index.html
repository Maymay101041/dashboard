<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Corporate Vehicle Management Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{font-family:'Noto Sans Thai',sans-serif;background:#eef4f0}
.header{background:linear-gradient(135deg,#0b6e4f,#198754,#20c997);color:#fff;padding:24px}
.cardx{background:#fff;border-radius:18px;padding:20px;box-shadow:0 4px 12px rgba(0,0,0,.08);height:100%}
.kpi{font-size:34px;font-weight:700;color:#198754}.section{margin-top:20px}
</style>
</head>
<body>
<div class="header"><div class="container-fluid"><div class="row align-items-center"><div class="col-lg-8"><h1>🚗 Corporate Vehicle Management Dashboard</h1><p>Executive Fleet Utilization & Cost Monitoring</p></div><div class="col-lg-4"><input type="file" id="excelFile" class="form-control" accept=".xlsx,.xls"></div></div></div></div>
<div class="container-fluid py-4">
<div class="row g-3">
<div class="col-md-2"><div class="cardx text-center"><div class="kpi" id="trip">0</div>Total Trips</div></div>
<div class="col-md-2"><div class="cardx text-center"><div class="kpi" id="done">0</div>Completed</div></div>
<div class="col-md-2"><div class="cardx text-center"><div class="kpi" id="pending">0</div>Pending</div></div>
<div class="col-md-2"><div class="cardx text-center"><div class="kpi" id="cancel">0</div>Cancelled</div></div>
<div class="col-md-2"><div class="cardx text-center"><div class="kpi" id="cars">0</div>Vehicles</div></div>
<div class="col-md-2"><div class="cardx text-center"><div class="kpi" id="cost">0</div>Cost</div></div>
</div>
<div class="section cardx"><h4>Executive Summary</h4><div id="summary">อัปโหลดไฟล์ Excel เพื่อสร้างรายงานผู้บริหาร</div></div>
<div class="row section g-3">
<div class="col-lg-6"><div class="cardx"><h5>Status Analysis</h5><canvas id="statusChart"></canvas></div></div>
<div class="col-lg-6"><div class="cardx"><h5>Top Vehicle Usage</h5><canvas id="vehicleChart"></canvas></div></div>
</div>
</div>
<script>
let statusChart,vehicleChart;
document.getElementById('excelFile').addEventListener('change',e=>{
const f=e.target.files[0]; if(!f)return;
const r=new FileReader();
r.onload=x=>{
const wb=XLSX.read(new Uint8Array(x.target.result),{type:'array'});
const ws=wb.Sheets[wb.SheetNames[0]];
const data=XLSX.utils.sheet_to_json(ws,{defval:''});
calculate(data);
};
r.readAsArrayBuffer(f);
});
function calculate(data){
let comp=0,pend=0,canc=0,totalCost=0; const veh={};
data.forEach(r=>{
const st=String(r.Status||r.STATUS||'');
if(st.includes('เสร็จ')) comp++; else if(st.includes('ยกเลิก')) canc++; else pend++;
const car=r['ทะเบียนรถ']||r.Vehicle||''; if(car) veh[car]=(veh[car]||0)+1;
const c=parseFloat(r['ค่าใช้จ่าย']||0); if(!isNaN(c)) totalCost+=c;
});
trip.textContent=data.length; done.textContent=comp; pending.textContent=pend; cancel.textContent=canc;
cars.textContent=Object.keys(veh).length; cost.textContent='฿'+Math.round(totalCost).toLocaleString();
const top=Object.entries(veh).sort((a,b)=>b[1]-a[1])[0];
summary.innerHTML=`จำนวนการจอง <b>${data.length}</b> งาน | งานเสร็จ <b>${comp}</b> งาน | ค่าใช้จ่ายรวม <b>฿${Math.round(totalCost).toLocaleString()}</b> | รถใช้งานสูงสุด <b>${top?top[0]:'-'}</b>`;
if(statusChart)statusChart.destroy();
statusChart=new Chart(document.getElementById('statusChart'),{type:'doughnut',data:{labels:['Completed','Pending','Cancelled'],datasets:[{data:[comp,pend,canc],backgroundColor:['#198754','#ffc107','#dc3545']} ]}});
const top10=Object.entries(veh).sort((a,b)=>b[1]-a[1]).slice(0,10);
if(vehicleChart)vehicleChart.destroy();
vehicleChart=new Chart(document.getElementById('vehicleChart'),{type:'bar',data:{labels:top10.map(x=>x[0]),datasets:[{label:'Trips',data:top10.map(x=>x[1]),backgroundColor:'#198754'}]}});
}
</script>
</body></html>
